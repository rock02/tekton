apiVersion: apps/v1
kind: Deployment
metadata:
  name: phiz-tekton-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phiz-tekton-app
  template:
    metadata:
      labels:
        app: phiz-tekton-app
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: app
          image: 111546515233.dkr.ecr.us-east-1.amazonaws.com/phiz-tekton-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
