apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ci-template
  namespace: tekton-pipelines
spec:
  params:
    - name: REPO_URL
      type: string
    - name: IMAGE_REPO
      type: string
    - name: REVISION
      type: string
      default: master

  workspaces:
    - name: shared-data
    - name: git-credentials

  tasks:
    - name: clone-repo
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.REPO_URL)
        - name: revision
          value: $(params.REVISION)
        - name: deleteExisting
          value: "true"
      workspaces:
        - name: output
          workspace: shared-data
        - name: ssh-directory
          workspace: git-credentials

    - name: extract-sha
      runAfter:
        - clone-repo
      taskSpec:
        workspaces:
          - name: source
        results:
          - name: commit
        steps:
          - name: extract
            image: alpine/git
            workingDir: $(workspaces.source.path)
            script: |
              #!/bin/sh
              set -e

              git config --global --add safe.directory $(workspaces.source.path)

              SHA=$(git rev-parse HEAD)
              echo -n "$SHA" > $(results.commit.path)
      workspaces:
        - name: source
          workspace: shared-data

    # - name: test-app
    #   runAfter:
    #     - extract-sha
    #   taskRef:
    #     name: gradle-test
    #   workspaces:
    #     - name: source
    #       workspace: shared-data

    - name: build-app
      runAfter:
        - clone-repo
      taskRef:
        name: gradle-build
      workspaces:
        - name: source
          workspace: shared-data

    - name: build-image
      runAfter:
        - build-app
      taskRef:
        name: kaniko-aws
      params:
        - name: IMAGE_REPO
          value: $(params.IMAGE_REPO)
        - name: IMAGE_TAG
          value: $(tasks.extract-sha.results.commit)
      workspaces:
        - name: source
          workspace: shared-data
