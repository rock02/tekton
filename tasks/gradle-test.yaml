apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: gradle-test
  namespace: tekton-pipelines
spec:
  workspaces:
    - name: source

  steps:
    - name: run-tests
      image: gradle:8.6-jdk21
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        ./gradlew test --no-daemon
