apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-refresh-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-refresh-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: secret-refresh-sa
    namespace: tekton-pipelines
roleRef:
  kind: Role
  name: secret-refresh-role
  apiGroup: rbac.authorization.k8s.io
