apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: phiz-app-run
  namespace: tekton-pipelines
spec:
  pipelineRef:
    name: phiz-app-pipeline

  taskRunTemplate:
    serviceAccountName: tekton-ecr-sa

  workspaces:
    - name: shared-data
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

    - name: git-credentials
      secret:
        secretName: git-ssh-key
